server:
  port: 18082

spring:
  application:
    name: onmessage

  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848  # 注册中心地址
      config:
        server-addr: localhost:8848  # 配置中心地址
        file-extension: yaml         # 配置文件格式

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: root
    password: 123456
    virtual-host: /
    listener:
      queues: onmessage1-queue

  # 数据库配置（如果需要）
  datasource:
    url: jdbc:mysql://localhost:3306/chatroom?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# 日志级别设置
logging:
  level:
    com.example.chatroom: debug

# 安全配置
security:
  oauth2:
    resource:
      id: chatroom-resource
